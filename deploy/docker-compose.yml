services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_PUBLIC_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: 1
      N8N_EDITOR_BASE_URL: https://${N8N_PUBLIC_HOST}
      WEBHOOK_URL: https://${N8N_PUBLIC_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_LOG_LEVEL: info
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BITRIX_WEBHOOK_BASE_URL: ${BITRIX_WEBHOOK_BASE_URL}
      BITRIX_ENTITY_TYPE_ID: ${BITRIX_ENTITY_TYPE_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TLDV_API_KEY: ${TLDV_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-internal
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - n8n-internal
    depends_on:
      - n8n

networks:
  n8n-internal:
    name: n8n-stack-internal
    driver: bridge

volumes:
  postgres_data:
    name: n8n-stack-postgres-data
  n8n_data:
    name: n8n-stack-n8n-data
  caddy_data:
    name: n8n-stack-caddy-data
  caddy_config:
    name: n8n-stack-caddy-config
